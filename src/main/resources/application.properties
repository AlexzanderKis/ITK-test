
# Spring Application
spring.application.name=ITK-test

# PostgreSQL DB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/itk-db}
spring.datasource.username=${DB_USERNAME:postgres123}
spring.datasource.password=${DB_PASSWORD:postgres123}

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml