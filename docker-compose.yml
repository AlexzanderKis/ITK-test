services:
  # PostgreSQL DB service
  postgres:
    image: postgres:17
#    container_name: itk-test-app
    restart: unless-stopped

    #    environment:
    #      POSTGRES_DB: itk-db
    #      POSTGRES_USER: postgres123
    #      POSTGRES_PASSWORD: postgres123
    #    ports:
    #      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # SB App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      DB_POOL_SIZE: ${DB_POOL_SIZE:-50}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

#   !ПЕРЕД ЗАПУСКОМ проверяем конфиг docker compose config
#   поднимаем БД docker compose up -d postgres
#   проверяем состояние и кол-во контейнеров docker compose ps
#   проверяем логи docker compose logs --follow postgres (в логах должно быть ready for start up)
#   проверяем готовность БД в контейнере docker compose exec postgres pg_isready --username postgres123 --dbname itk-db